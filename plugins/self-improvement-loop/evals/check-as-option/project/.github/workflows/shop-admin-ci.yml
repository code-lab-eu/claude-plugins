name: shop-admin-ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev ruff check src/ tests/
      - run: uv run --extra dev ruff format --check src/ tests/
      - run: uv run --extra dev mypy src/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop_admin
          POSTGRES_PASSWORD: shop_admin
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev pytest

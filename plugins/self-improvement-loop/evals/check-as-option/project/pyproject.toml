[project]
name = "shop-admin"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.120",
  "jinja2>=3.1",
  "asyncpg>=0.30",
  "playwright>=1.60",
  "typer>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "httpx>=0.28",
  "ruff>=0.14",
  "mypy>=1.18",
]

[project.scripts]
shop-admin = "shop_admin.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

{% extends "base.html" %}
{% block content %}
<table class="table table-hover">
  <thead>
    <tr><th>Product</th><th>Stock</th><th></th></tr>
  </thead>
  <tbody>
    {% for product in products %}
    <tr class="position-relative">
      <td>
        <a href="/products/{{ product.code }}"
           class="stretched-link fw-bold text-reset text-decoration-none">{{ product.name }}</a>
      </td>
      <td>{{ product.stock }}</td>
      <td class="position-relative z-2">
        <button class="btn btn-sm btn-outline-secondary"
                hx-post="/products/{{ product.code }}/restock">Restock</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
